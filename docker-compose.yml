version: "3.9"

services:
  backend:
    image: siem-backend:latest
    container_name: scriem-backend
    ports:
      - "9000:9000"

    environment:
      # DB (stored inside container, persisted via folder mount)
      - DATABASE_URL=sqlite:////data/siem.db

      # Security / Auth
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM}

      # CORS
      - ALLOW_ORIGINS=${ALLOW_ORIGINS}

      # Runtime
      - APP_ENV=production
      - LOG_LEVEL=${LOG_LEVEL}

    volumes:
      # ✅ FIXED: mount folder instead of file
      - ./data:/data

    restart: unless-stopped

  frontend:
    image: siem-frontend:latest
    container_name: scriem-frontend
    ports:
      - "8080:80"

    depends_on:
      - backend

    restart: unless-stopped