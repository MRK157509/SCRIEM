services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: scriem-backend
    ports:
      - "9000:9000"
    environment:
      # DB
      - DATABASE_URL=sqlite:////data/siem.db

      # Security / Auth
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM}

      # CORS
      - ALLOW_ORIGINS=${ALLOW_ORIGINS}

      # App runtime
      - APP_ENV=production
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      # persist sqlite DB outside container
      - ./siem.db:/data/siem.db
    restart: unless-stopped

  frontend:
    build:
      context: ./scriem-ui
      dockerfile: Dockerfile
    container_name: scriem-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
