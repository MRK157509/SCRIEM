services:
  backend:
    image: siem-backend:latest
    container_name: scriem-backend
    ports:
      - "9000:9000"
    environment:
      # DB (SQLite inside container, persisted via bind mount)
      - DATABASE_URL=sqlite:////data/siem.db

      # Security / Auth
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM}

      # CORS (keep this permissive for local; tighten later)
      - ALLOW_ORIGINS=${ALLOW_ORIGINS}

      # App runtime
      - APP_ENV=production
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      # Persist sqlite DB outside container
      - ./siem.db:/data/siem.db
    restart: unless-stopped

  frontend:
    image: siem-frontend:latest
    container_name: scriem-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
