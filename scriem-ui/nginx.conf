server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # -----------------------------
  # API gateway (UI calls /api/*)
  # -----------------------------
  location /api/ {
  # --- CORS preflight ---
  if ($request_method = OPTIONS) {
    add_header 'Access-Control-Allow-Origin' "$http_origin" always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    return 204;
  }

  # --- Actual API proxy ---
  proxy_pass http://backend:9000/;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # --- CORS for normal responses ---
  add_header 'Access-Control-Allow-Origin' "$http_origin" always;
  add_header 'Access-Control-Allow-Credentials' 'true' always;
}

  # (Optional) also allow direct non-/api routes if anything uses them
  location /auth/        { proxy_pass http://backend:9000; }
  location /alerts/      { proxy_pass http://backend:9000; }
  location /events/      { proxy_pass http://backend:9000; }
  location /rules/       { proxy_pass http://backend:9000; }
  location /timeline/    { proxy_pass http://backend:9000; }
  location /agents/      { proxy_pass http://backend:9000; }
  location /iocs/        { proxy_pass http://backend:9000; }
  location /metrics/     { proxy_pass http://backend:9000; }
  location /openapi.json { proxy_pass http://backend:9000; }
  location /docs         { proxy_pass http://backend:9000; }

  # -----------------------------
  # SPA fallback
  # -----------------------------
  location / {
    try_files $uri $uri/ /index.html;
  }
}
